<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Menz</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card">
    <h1>Reset password</h1>
    <p class="subtitle">Choose a new password for your account.</p>

    <div id="message" class="message error"></div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <div class="field-error" id="password-error"></div>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
        <div class="field-error" id="confirm_password-error"></div>
      </div>

      <button type="submit" id="submit-btn">Change password</button>
    </form>

    <div class="links">
      <a href="/login.html">Back to log in</a>
      <span></span>
    </div>
  </div>

  <script src="/js/validators.js"></script>
  <script>
    const form = document.getElementById('reset-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');
    const token = new URLSearchParams(window.location.search).get('token');

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.add('visible');
    }

    function setFieldError(fieldName, text) {
      const el = document.getElementById(`${fieldName}-error`);
      el.textContent = text || '';
      el.classList.toggle('visible', Boolean(text));
    }

    if (isBlank(token)) {
      showMessage('This reset link is invalid or missing a token. Request a new one.');
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      messageEl.classList.remove('visible');
      setFieldError('password', '');
      setFieldError('confirm_password', '');

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      let hasError = false;
      if (isBlank(password) || password.length < 6) {
        setFieldError('password', 'Password must be at least 6 characters long');
        hasError = true;
      }
      if (!hasError && password !== confirmPassword) {
        setFieldError('confirm_password', 'Passwords do not match');
        hasError = true;
      }
      if (hasError) return;

      submitBtn.disabled = true;
      try {
        const response = await fetch('/api/password/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirm_password: confirmPassword }),
        });
        const data = await response.json();

        if (!response.ok) {
          showMessage((data.errors && data.errors[0]) || 'Something went wrong. Please try again.');
          submitBtn.disabled = false;
          return;
        }

        window.location.href = '/login.html';
      } catch (err) {
        showMessage('Something went wrong. Please try again.');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
