<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Menz</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card">
    <h1>Forgot password</h1>
    <p class="subtitle">We'll email you a link to reset it.</p>

    <div id="message" class="message"></div>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <div class="field-error" id="email-error"></div>
      </div>

      <button type="submit" id="submit-btn">Send reset link</button>
    </form>

    <div class="links">
      <a href="/login.html">Back to log in</a>
      <span></span>
    </div>
  </div>

  <script src="/js/validators.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message visible ${type}`;
    }

    function setFieldError(text) {
      const el = document.getElementById('email-error');
      el.textContent = text || '';
      el.classList.toggle('visible', Boolean(text));
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      setFieldError('');
      messageEl.classList.remove('visible');

      const email = document.getElementById('email').value;
      if (isBlank(email) || !isValidEmail(email)) {
        setFieldError('Enter a valid email address');
        return;
      }

      submitBtn.disabled = true;
      try {
        const response = await fetch('/api/password/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await response.json();

        if (!response.ok) {
          showMessage((data.errors && data.errors[0]) || 'Something went wrong. Please try again.', 'error');
          return;
        }

        showMessage(data.message || 'If that email is registered, a password reset link has been sent.', 'success');
        form.reset();
      } catch (err) {
        showMessage('Something went wrong. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
